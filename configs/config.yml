project:
  timezone: "Europe/Kyiv"
  version: "2026.05.22"

# Field mapping from CSV columns to canonical field names
# Can be detected automatically if auto_mapping is enabled
fields_mapping:
  key: "Key"
  # Adjusted to match sample CSV headers ("Created" / "Resolved") instead of Jira export names
  created_at: "Created"
  resolved_at: "resolutiondate"
  status: "Status"
  resolution: "Resolution"  # Optional: JIRA resolution field (e.g. Fixed, Won't Fix, Cancelled)
  priority: "Priority"
  fix_version: "FixVersions"
  environment: "customfield_12200"
  # category: "Component"  # Optional field - not currently used in any metrics

# Automatic field mapping detection (optional)
# When enabled, LLM will analyze CSV headers and suggest field mappings
auto_mapping:
  enabled: false  # Set to true to enable auto-detection
  sample_rows: 5  # Number of sample rows to analyze for better accuracy
  # Usage:
  #   CLI: --auto-map flag overrides this setting
  #   UI: Toggle "Auto-detect fields" in sidebar
  # Notes:
  #   - Requires LLM to be enabled and configured
  #   - Falls back to fuzzy matching if LLM unavailable
  #   - Analysis will fail if required fields not detected
  #   - Detected mapping overrides manual fields_mapping above  

# Automatic environment value mapping (optional)
# When enabled, analyzes unique environment values and maps them to standard categories
auto_env_mapping:
  enabled: false  # Set to true to enable auto-detection
  allow_passthrough: true  # If true, unmapped values stay as-is; if false, they cause errors
  target_categories: ["LOCAL", "DEV", "QA", "STAGE", "UAT", "PERF", "PROD", "NON_PROD"]
  # Usage:
  #   CLI: --auto-map-env flag overrides this setting
  #   UI: Toggle "Auto-map environment values" in sidebar
  # Notes:
  #   - Requires LLM to be enabled for intelligent classification
  #   - Falls back to fuzzy keyword matching if LLM unavailable
  #   - Maps values like "production" → "PROD", "testing" → "QA", etc.
  #   - New unmapped categories are added to env_order automatically

# Manual environment value mapping (optional)
# Explicitly define value transformations (applied before auto-mapping if both enabled)
env_value_mapping:
  # Example mappings:
  # PRODUCTION: PROD
  # "prod-server": PROD
  # testing: QA
  # "qa-env": QA
  # development: DEV

# Automatic semantic classification (optional)
# When enabled, AI analyzes data to classify statuses, priorities, and environments
auto_classification:
  enabled: false  # Set to true to enable AI-powered classification
  classify_statuses: true  # Classify statuses into open/closed/rejected
  classify_priorities: true  # Order priorities by severity
  classify_environments: true  # Classify environments into prod/non-prod
  require_manual_review: false  # If true, show classification but don't auto-apply
  confidence_threshold: 0.6  # Minimum confidence (0.0-1.0) to auto-apply
  # Usage:
  #   CLI: --auto-classify flag overrides this setting
  #   UI: Toggle "Auto-classify data" in sidebar
  # Notes:
  #   - Requires LLM to be enabled for intelligent classification
  #   - Falls back to fuzzy keyword matching if LLM unavailable
  #   - Classifications shown in report with confidence scores
  #   - Eliminates need for hardcoded status lists in metric configs

metrics:
  enabled:
    - leakage_rate
    - defects_by_priority
    - defects_by_env_priority
    - defects_by_status_environment
    - cumulative_open_closed
    - status_by_severity
    - defect_age
    - age_by_priority  
    - root_cause_distribution
    - rejection_rate

  params:
    common:
      exclude_statuses: ["Canceled", "Cancelled"]
    defect_age:
      open_statuses: ["Funnel","Analysis","In Progress","Ready for QA","QA","Ready for Production"]    
    leakage_rate:
      intended_env: ["QA"]  # Standard category after auto-mapping (Testing → QA)
      leak_envs: ["PROD"]  # Standard category after auto-mapping (Production → PROD)
    root_cause_distribution:
      top_n: 10
    rejection_rate:
      # rejected_resolutions: used when a 'resolution' column is present (resolution-first logic)
      # rejected_statuses: fallback when only 'status' column is available
      rejected_resolutions: ["Rejected", "Canceled", "Cancelled", "Won't Fix", "WONTFIX", "Duplicate", "Invalid", "Cannot Reproduce"]
      rejected_statuses: ["Rejected", "Canceled", "Cancelled", "Won't Fix", "WONTFIX"]
    # defects_by_env_priority:
    #   # No env_order needed - environments are discovered from data
    #   # and ordered by defect count (descending)
    status_by_severity:
      open_statuses: ["Funnel", "Analysis", "To Do", "In Progress", "Blocked / On Hold", "Ready for Production"]
      closed_statuses: ["Done", "Cancelled"]

llm:
  enabled: true
  prompts_dir: "prompts"  # Path relative to qa_bugs package directory
  
  # Provider: 'azure' or 'openai'
  provider: openai
  #provider: azure
  
  # === Azure OpenAI Configuration ===
  # Uncomment and configure these when using provider: azure
  #endpoint: "https://ai-proxy.lab.epam.com"  # Your Azure endpoint
  #deployment: "gpt-5-chat-2025-08-07"  # Azure deployment name
  #api_version: "2024-05-01-preview"  # Azure API version
  # Credentials: Set AZURE_OPENAI_KEY and AZURE_OPENAI_ENDPOINT env vars
  
  # === OpenAI API Configuration ===
  # Uncomment and configure these when using provider: openai
  model: "gpt-5.4"  # OpenAI model name (gpt-5.4, gpt-5-mini, gpt-4o-mini, etc.)
  # api_key: ""  # Optional: specify here or set OPENAI_API_KEY env var (recommended)
  
  enable_retries: false  # fail fast: do not retry failed/empty LLM calls
  temperature: 1
  max_tokens: 700
  max_tokens_gpt5: 1200  # optional override for GPT-5 models (ignored for non-GPT-5)
  debug: true  # enable structured LLM debug logging
  log_prompts: true  # persist prompt & response text files in run output directory
  log_raw_io: false  # persist raw request/response JSON in run output directory\llm_raw
  table_row_limit: 200
  summary_table_row_limit: 40
  max_prompt_chars: 120000
  context_format: csv  # use CSV instead of JSON for LLM context (more token-efficient)
