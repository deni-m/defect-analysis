project:
  timezone: "Europe/Kyiv"

# Field mapping from CSV columns to canonical field names
# Can be detected automatically if auto_mapping is enabled
fields_mapping:
  key: "Key"
  # Adjusted to match sample CSV headers ("Created" / "Resolved") instead of Jira export names
  created_at: "Created"
  resolved_at: "resolutiondate"
  status: "Status"
  priority: "Priority"
  fix_version: "FixVersions"
  environment: "customfield_12200"
  category: "Component"

# Automatic field mapping detection (optional)
# When enabled, LLM will analyze CSV headers and suggest field mappings
auto_mapping:
  enabled: false  # Set to true to enable auto-detection
  sample_rows: 5  # Number of sample rows to analyze for better accuracy
  # Usage:
  #   CLI: --auto-map flag overrides this setting
  #   UI: Toggle "Auto-detect fields" in sidebar
  # Notes:
  #   - Requires LLM to be enabled and configured
  #   - Falls back to fuzzy matching if LLM unavailable
  #   - Analysis will fail if required fields not detected
  #   - Detected mapping overrides manual fields_mapping above  

metrics:
  enabled:
    - leakage_rate
    - defects_by_env_priority
    - cumulative_open_closed
    - status_by_severity
    - defect_age
    - age_by_priority  
    - rejection_rate

  params:
    common:
      exclude_statuses: ["Canceled", "Cancelled"]
    defect_age:
      open_statuses: ["Funnel","Analysis","In Progress","Ready for QA","QA","Ready for Production"]    
    leakage_rate:
      intended_env: ["QA"]
      leak_envs: ["Prod"]
    rejection_rate:
      rejected_statuses: ["Rejected", "Canceled", "Cancelled", "Won't Fix", "WONTFIX"]
    defects_by_env_priority:
      env_order: ["LOCAL", "DEV", "QA", "STAGE", "UAT", "PERF", "PROD"]
    status_by_severity:
      open_statuses: ["Funnel", "Analysis", "To Do", "In Progress", "Blocked / On Hold", "Ready for Production"]
      closed_statuses: ["Done", "Cancelled"]

llm:
  enabled: true
  prompts_dir: "prompts"  # Path relative to qa_bugs package directory
  provider: azure
  endpoint: "https://ai-proxy.lab.epam.com"  # ← Your EPAM proxy URL
  deployment: "gpt-5-chat-2025-08-07"
  api_version: "2024-05-01-preview"
  temperature: 1
  max_tokens: 700
  debug: true  # enable structured LLM debug logging
  log_prompts: true  # persist prompt & response text files in run output directory
  table_row_limit: 200
  summary_table_row_limit: 40
  max_prompt_chars: 120000
  context_format: csv  # use CSV instead of JSON for LLM context (more token-efficient)